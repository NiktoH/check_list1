name: Automated tests

on:
  push

jobs:
  test:
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: install dependencies
        run: pip install -r req.txt
      - name: Run tests
        run: pytest